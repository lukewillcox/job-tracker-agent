name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --all-extras --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy (strict)
        run: uv run mypy
      - name: Pytest
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Ruff (cli)
        working-directory: cli
        run: uv run --no-project --with ruff ruff check jobtracker_cli tests
      # Test the checked-out CLI against the checked-out backend (PYTHONPATH),
      # rather than resolving the backend from git, so CI tests this commit.
      - name: Pytest (cli)
        working-directory: cli
        env:
          PYTHONPATH: ../backend:.
        run: >-
          uv run --no-project --python 3.12
          --with pytest --with keyring --with rich --with click
          --with requests --with msal --with openpyxl --with "pydantic>=2.7"
          --with pyyaml --with boto3
          python -m pytest -q tests

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: cdk synth
        run: npx cdk synth --quiet
