[project]
name = "job-tracker-agent-backend"
version = "0.1.0"
description = "Backend for the Job Application Tracker Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "boto3>=1.34",
    "aws-lambda-powertools>=2.38",
    "msal>=1.28",
]

[dependency-groups]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "moto>=5.0",
    "types-pyyaml>=6.0",
    "boto3-stubs[dynamodb,sqs,ses,kms,stepfunctions,secretsmanager,scheduler]>=1.34",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = [
    "domain",
    "store",
    "integrations",
    "excel",
    "agent",
    "api",
]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["openpyxl.*", "msal.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:job_tracker.*"]

[tool.hatch.build.targets.wheel]
packages = ["domain", "store", "integrations", "excel", "agent", "api"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
