[project]
name = "jobtracker-cli"
version = "0.1.0"
description = "Local Job Tracker: reads your Outlook (read-only), tracks applications, keeps an Excel tracker. Classification runs on the host's shared API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "job-tracker-agent-backend",
    "msal>=1.28",
    "requests>=2.31",
    "keyring>=25.0",
    "click>=8.1",
    "rich>=13.7",
    "openpyxl>=3.1",
    "pydantic>=2.7",
]

[project.scripts]
jobtracker = "jobtracker_cli.main:cli"

# Reuse the shared logic (domain models, matcher, state machine, Excel, classify
# schema) from the backend package in the same repo.
[tool.uv.sources]
job-tracker-agent-backend = { git = "https://github.com/lukewillcox/job-tracker-agent", subdirectory = "backend" }

[dependency-groups]
dev = ["ruff>=0.5", "mypy>=1.10", "pytest>=8.2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jobtracker_cli"]
